[workspace]
members  = ["crates/*"]
resolver = "2"

[workspace.package]
authors      = ["Reverier-Xu <reverier.xu@xdsec.club>"]
edition      = "2024"
homepage     = "https://github.com/XDSEC/WebSocketReflectorX"
license      = "MIT"
repository   = "https://github.com/XDSEC/WebSocketReflectorX"
rust-version = "1.95"
version      = "0.6.1"

[profile.release]
codegen-units = 1
lto           = "thin"
opt-level     = 3
panic         = "abort"
strip         = true

[workspace.dependencies]
axum             = { version = "0.8", features = ["macros", "ws"] }
directories      = "6.0"
futures-util     = { version = "0.3", features = ["sink"] }
local-ip-address = "0.6"
rustls           = { version = "0.23", features = ["ring"] }
thiserror        = "2.0"
tokio            = { version = "1.53", features = ["full"] }
tokio-util       = { version = "0.7", features = ["codec"] }

# optional
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }

# binary cli only
bitflags           = { version = "2.13" }
chrono             = { version = "0.4", features = ["serde"] }
clap               = { version = "4.6", features = ["derive"] }
once_cell          = { version = "1.21" }
rand               = { version = "0.10" }
serde              = { version = "1.0", features = ["derive", "rc"] }
serde_json         = { version = "1.0" }
subprocess         = { version = "1.2" }
tower-http         = { version = "0.7", features = ["cors", "trace"] }
tracing            = { version = "0.1" }
tracing-appender   = { version = "0.2" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url                = { version = "2.5" }

# GUI
async-compat = { version = "0.2" }
open         = "5.4"

# GPUI / Woocraft
# gpui / gpui_platform 请统一使用 woocraft 的 re-export（woocraft::gpui / woocraft::gpui_platform），
# 不要直接依赖 zed 仓库，避免与 woocraft 解析到不同的 rev。
woocraft = { git = "https://github.com/Reverier-Xu/woocraft", package = "woocraft" }

reqwest = { version = "0.13", features = [
  "blocking",
  "charset",
  "http2",
  "json",
] }

sys-locale = "0.3"
sysinfo    = "0.39"
toml       = "1.1"

# build dependencies
build-target  = "0.8"
git-version   = "0.3"
rustc_version = "0.4"
winres        = "0.1"
