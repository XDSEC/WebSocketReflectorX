# en-us translations for the wsrx desktop app.
#
# This identity file is required: rust-i18n's missing-key fallback renders
# `"<locale>.<key>"`, so without it every untranslated (English) string would
# show an `en-us.` prefix. Any new UI string must therefore be added here
# (and to the other locale files).

